<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;background:#06070a;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 80% at 50% 18%,rgba(120,130,160,.18),transparent 60%),
      radial-gradient(circle at 50% 32%,#2b2f3c 0%,#15171f 52%,#06070a 100%);}
  /* soft floor reflection under the console */
  #stage:after{content:"";position:absolute;bottom:4%;width:46%;height:5%;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(3px);}
  /* ============ GAME BOY BODY ============ */
  #gb{position:relative;display:flex;flex-direction:column;
    background:
      radial-gradient(130% 70% at 28% -5%,rgba(255,255,255,.45),transparent 52%),
      radial-gradient(120% 120% at 95% 105%,rgba(0,0,0,.16),transparent 55%),
      linear-gradient(152deg,#efede4 0%,#e4e2d8 30%,#cdcbc0 64%,#b4b2a6 88%,#a3a195 100%);
    border-radius:14px 14px 64px 14px;
    box-shadow:
      0 26px 54px rgba(0,0,0,.7),
      0 6px 0 rgba(0,0,0,.28),
      0 2px 1px rgba(0,0,0,.4),
      inset 0 3px 0 rgba(255,255,255,.85),
      inset 0 -12px 20px rgba(0,0,0,.24),
      inset -5px 0 12px rgba(0,0,0,.12),
      inset 5px 0 12px rgba(255,255,255,.22);
    padding:20px 18px 14px;}
  /* faint moulded ridge near top */
  #gb:before{content:"";position:absolute;left:16px;right:16px;top:12px;height:0;
    border-top:2px solid rgba(255,255,255,.55);border-bottom:1px solid rgba(0,0,0,.15);}
  /* subtle plastic speckle */
  #gb:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1px);
    background-size:4px 4px;opacity:.55;mix-blend-mode:multiply;}
  /* power switch on the top edge */
  #pwr{position:absolute;top:-6px;left:34px;width:54px;height:11px;border-radius:4px;
    background:linear-gradient(180deg,#c9c7bd,#9a988e);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4);}
  #pwr:before{content:"";position:absolute;left:4px;top:2px;width:18px;height:7px;border-radius:3px;
    background:linear-gradient(180deg,#3a3d45,#1f2128);box-shadow:inset 0 1px 1px rgba(255,255,255,.18);}
  #pwr:after{content:"◄ OFF • ON";position:absolute;right:5px;top:1px;
    font:700 6px/9px "Trebuchet MS";color:#6c6a60;letter-spacing:.3px;}
  /* screen pocket */
  #pocket{position:relative;margin-top:8px;
    background:linear-gradient(160deg,#71757f 0%,#565a64 45%,#43464f 100%);
    border-radius:10px 10px 42px 12px;padding:16px 22px 14px;
    box-shadow:inset 0 5px 12px rgba(0,0,0,.6), inset 0 -2px 4px rgba(255,255,255,.10), 0 1px 0 rgba(255,255,255,.28);}
  #ptop{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-left:2px;}
  #led{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a78,#c41f10);
    box-shadow:0 0 8px #ff5a44,inset 0 1px 1px rgba(255,255,255,.7);}
  #ptop span{font:700 8px/1 "Trebuchet MS";color:#b6bac4;letter-spacing:1.6px;}
  /* black bezel around LCD */
  #bezel{position:relative;background:linear-gradient(160deg,#1d1e25,#0d0e14);
    border-radius:6px 6px 18px 6px;padding:10px 12px 11px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.05),
      0 1px 0 rgba(255,255,255,.18);}
  /* twin guide lines flanking the screen, like the real DMG bezel print */
  #bezel:before{content:"";position:absolute;left:5px;top:14px;bottom:18px;width:2px;
    background:linear-gradient(#7a2f6e,#2d3470);opacity:.55;border-radius:2px;}
  /* LCD scanlines + faint dot-matrix + glass glare, all over the screen */
  #bezel:after{content:"";position:absolute;left:12px;right:12px;top:10px;bottom:11px;pointer-events:none;border-radius:2px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%),
      repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);}
  #scr{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;
    background:#9bbc6b;border-radius:2px;
    box-shadow:inset 0 0 16px rgba(40,70,30,.45);}
  #subline{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;}
  #subline b{font:italic 800 10px/1 Georgia,serif;color:#dad6c8;letter-spacing:.6px;}
  #subline i{font:italic 800 10px/1 Georgia,serif;color:#c0392b;font-style:italic;}
  #brandrow{display:flex;align-items:baseline;justify-content:center;gap:5px;margin-top:1px;margin-bottom:8px;}
  #brandrow .b1{font:800 16px/1 "Trebuchet MS";color:#2d3470;font-style:italic;letter-spacing:.5px;
    text-shadow:0 1px 0 rgba(255,255,255,.55);}
  #brandrow .b2{font:700 9px/1 "Trebuchet MS";color:#6a6f8a;letter-spacing:3px;}
  /* ============ CONTROLS ============ */
  #controls{position:relative;flex:1 0 auto;height:150px;margin-top:12px;}
  #dpad{position:absolute;left:10px;top:14px;width:104px;height:104px;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
  #dpad *{touch-action:none;}
  .dk{position:absolute;background:linear-gradient(160deg,#41444c,#222429);}
  #dpu{left:37px;top:0;width:30px;height:39px;border-radius:7px 7px 0 0;}
  #dpd{left:37px;top:65px;width:30px;height:39px;border-radius:0 0 7px 7px;}
  #dpl{left:0;top:37px;width:39px;height:30px;border-radius:7px 0 0 7px;}
  #dpr{left:65px;top:37px;width:39px;height:30px;border-radius:0 7px 7px 0;}
  #dpc{left:36px;top:36px;width:32px;height:32px;}
  .dk:after{content:"";position:absolute;inset:4px;border-radius:3px;
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.20));}
  #abwrap{position:absolute;right:8px;top:8px;width:140px;height:96px;transform:rotate(-24deg);}
  .ab{position:absolute;width:54px;height:54px;border-radius:50%;color:#ffe;
    background:radial-gradient(circle at 35% 28%,#cf5690,#7c2750 72%);
    box-shadow:0 5px 6px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.32);

  #btnA{right:0;top:18px;} #btnB{right:60px;top:44px;}
  .ablab{position:absolute;font:800 11px "Trebuchet MS";color:#7c2750;letter-spacing:.5px;

  #labA{right:14px;top:82px;} #labB{right:74px;top:100px;}
  .ss{position:absolute;bottom:6px;width:48px;height:14px;border-radius:9px;
    background:linear-gradient(160deg,#4a4d55,#2a2c32);transform:rotate(-24deg);

  #start{left:50%;margin-left:2px;} #select{left:50%;margin-left:-58px;}
  .sslab{position:absolute;font:800 8px "Trebuchet MS";color:#2d3470;letter-spacing:1px;

  #lstart{left:50%;margin-left:8px;bottom:-4px;} #lselect{left:50%;margin-left:-54px;bottom:-4px;}
  #speaker{position:absolute;right:4px;bottom:0;width:74px;height:54px;transform:rotate(-24deg);

      radial-gradient(circle at center,rgba(0,0,0,.28) 1.3px,transparent 1.6px) 0 0/8px 8px,
      radial-gradient(circle at center,rgba(255,255,255,.22) 1.1px,transparent 1.5px) 1px 1px/8px 8px;
    border-radius:6px;opacity:.7;}
  .press{filter:brightness(1.4);} .ab.press{transform:scale(.93);} .dk.press{filter:brightness(1.5);}
  /* instant launch splash — covers the page so the first tap goes fullscreen (hides URL bar) */
  #launch{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;cursor:pointer;
    background:radial-gradient(120% 90% at 50% 30%,#1a3a6b 0%,#0b1730 55%,#06070a 100%);
    color:#fff;text-align:center;padding:24px;}
  #launchIcon{width:128px;height:128px;border-radius:28px;image-rendering:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.55);animation:lbob 2.6s ease-in-out infinite;}
  #launchTitle{font:800 34px/1 "Trebuchet MS";color:#ffcb05;letter-spacing:1px;
    text-shadow:0 2px 0 #2a52a0,0 3px 6px rgba(0,0,0,.5);margin-top:6px;}
  #launchSub{font:700 15px "Trebuchet MS";color:#dfe8ff;opacity:.92;letter-spacing:.5px;}
  #launchGo{margin-top:18px;font:800 15px "Trebuchet MS";letter-spacing:2px;color:#fff;
    padding:10px 20px;border-radius:24px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.25);animation:lpulse 1.4s ease-in-out infinite;}
  @keyframes lpulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
  @keyframes lbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  #launch.hide{opacity:0;pointer-events:none;transition:opacity .35s ease;}
</style>
</head>
<body>
<div id="stage">
  <div id="gb">
    <div id="pwr"></div>
    <div id="pocket">
      <div id="ptop"><div id="led"></div><span>POWER</span></div>
      <div id="bezel"><canvas id="scr" width="160" height="144"></canvas></div>
      <div id="subline"><b>DOT MATRIX WITH</b><i>STEREO</i><b>SOUND</b></div>
    </div>
    <div id="brandrow"><span class="b1">Pok&eacute;mon</span><span class="b2">CLASS EDITION</span></div>
    <div id="controls">

        <div class="dk" id="dpu"></div><div class="dk" id="dpd"></div>

</div>
<div id="launch">

  <div id="launchSub">Mr Brewin's Class</div>
  <div id="launchGo">&#9654; TAP TO PLAY</div>
</div>
<script>

    "But every child here will carry a little piece",

/* ===================================================================================== */
const T=s=>(s||"").replaceAll("{T}",CONFIG.teacherName).replaceAll("{P}",CONFIG.starter);

/* ---------------- COLOUR PALETTE ---------------- */

  black:"#20222c", white:"#fbfbf2", ink:"#2a313c",
  grass:"#79c05a", grassD:"#5aa247", grassL:"#9ed873",
  path:"#ecd6a2", pathD:"#d4ba80", pathE:"#c4a86e",

  roof:"#e0563c", roofD:"#ab3a25", roofL:"#f5876a",
  labroof:"#8a93ab", labroofD:"#5e6883",
  wall:"#f0deb6", wallD:"#cdab7c", door:"#a8612f", doorD:"#79431c", win:"#bfe8ff",
  fence:"#d29653", fenceD:"#955f2a",
  flowerR:"#ee5f72", flowerY:"#ffd35a", flowerP:"#cd86e2",
  sign:"#bb8244", signD:"#825733",
  ledge:"#d6ac56", ledgeD:"#9a7634",

/* Dragonite palette tuned to the trading-card art: warm golden-orange body,
   pale sea-green wings, soft cream belly, gentle dark eyes */
const D={ out:"#3a2a16", body:"#eaa53f", bodyD:"#c47d28", bodyL:"#f7cf80",
  cream:"#f7eed2", creamD:"#dccaa0", wing:"#7cb9a7", wingD:"#4d8474", wingL:"#a8d6c7",
  white:"#ffffff", eye:"#2a241c", nose:"#9a6322", claw:"#f4efe0" };

/* ---------------- CANVAS ---------------- */
const SCRW=160, SCRH=144;
const scr=document.getElementById("scr"), ctx=scr.getContext("2d");
ctx.imageSmoothingEnabled=false;
function fitScreen(){ const gb=document.getElementById("gb");
  const vw=window.innerWidth, vh=window.innerHeight, ratio=0.60;
  let gw=Math.min(vw*0.99, 440), gh=gw/ratio;
  if(gh>vh*0.99){ gh=vh*0.99; gw=gh*ratio; }
  gb.style.width=gw+"px"; gb.style.height=gh+"px"; }
addEventListener("resize",fitScreen); fitScreen();
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function clear(c){ rect(0,0,SCRW,SCRH,c); }

/* ---------------- FONT (5x7 mixed case) ---------------- */

function drawText(s,x,y,col,sc){ sc=sc||1; s=""+s; let cx=x;
  for(const ch of s){ const g=FONT[ch]||FONT[" "];
    for(let r=0;r<7;r++)for(let c=0;c<5;c++) if(g[r*5+c]==="1") rect(cx+c*sc,y+r*sc,sc,sc,col);
    cx+=6*sc; } }
/* soft drop-shadow text for headings */
function drawTextSh(s,x,y,col,sh,sc){ sc=sc||1; drawText(s,x+sc,y+sc,sh,sc); drawText(s,x,y,col,sc); }
function textW(s,sc){ return (""+s).length*6*(sc||1)-(sc||1); }
function drawCenter(s,y,col,sc){ drawText(s,Math.round((SCRW-textW(s,sc))/2),y,col,sc); }

function wrap(s,maxC){ const w=T(s).split(" "); const out=[]; let ln="";
  for(const x of w){ const t=ln?ln+" "+x:x; if(t.length>maxC&&ln){out.push(ln);ln=x;}else ln=t; }
  if(ln)out.push(ln); return out; }

/* lighten/darken a hex colour */
function shade(hex,amt){ hex=hex.replace("#",""); if(hex.length===3)hex=hex.split("").map(c=>c+c).join("");
  let r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return "rgb("+r+","+g+","+b+")"; }

/* ---------------- TOWN MAP ---------------- */
function buildTown(){ const W=22,H=24, g=[];
  for(let y=0;y<H;y++){ g[y]=[]; for(let x=0;x<W;x++) g[y][x]=tGRASS; }
  const S=(x,y,t)=>{ if(x>=0&&y>=0&&x<W&&y<H) g[y][x]=t; };
  for(let x=0;x<W;x++){ S(x,0,tTREE); S(x,H-1,tTREE); }
  for(let y=0;y<H;y++){ S(0,y,tTREE); S(W-1,y,tTREE); }
  S(10,0,tTALL); S(11,0,tTALL); for(let y=1;y<=2;y++){ S(10,y,tTALL); S(11,y,tTALL); }
  // player's house (red roof)
  for(let x=2;x<=5;x++) S(x,2,tHROOF); for(let x=2;x<=5;x++){ S(x,3,tHWALL); S(x,4,tHWALL); } S(4,3,tWIN); S(3,4,tHDOOR);
  // neighbour house
  for(let x=16;x<=19;x++) S(x,2,tHROOF); for(let x=16;x<=19;x++){ S(x,3,tHWALL); S(x,4,tHWALL); } S(17,3,tWIN); S(18,4,tHDOOR);
  // big school/lab building
  for(let x=8;x<=14;x++){ S(x,16,tLROOF); S(x,17,tLROOF); } S(11,16,tLROOFM);
  for(let x=8;x<=14;x++){ S(x,18,tLWALL); S(x,19,tLWALL); S(x,20,tLWALL); } S(11,20,tLDOOR); S(7,21,tSIGN);
  // paths
  for(let y=5;y<=22;y++){ S(3,y,tPATH); S(18,y,tPATH); } for(let x=3;x<=18;x++) S(x,21,tPATH);
  for(let y=21;y<=22;y++) S(11,y,tPATH);
  // garden fences + flowers
  for(let x=6;x<=9;x++) S(x,7,tFENCE); for(let y=8;y<=10;y++){ S(6,y,tFENCE); S(9,y,tFENCE); }
  for(let x=7;x<=8;x++) for(let y=8;y<=9;y++) S(x,y,tFLOWER);
  // pond + ledge
  for(let y=12;y<=14;y++) for(let x=15;x<=18;x++) S(x,y,tWATER); S(14,12,tLEDGE); S(14,13,tLEDGE);
  // tall grass
  for(let y=9;y<=11;y++) for(let x=12;x<=14;x++) S(x,y,tTALL);
  [[5,6],[13,6],[2,13],[5,16],[16,8],[19,15],[6,18],[15,18],[9,14],[4,9]].forEach(([x,y])=>{ if(g[y][x]===tGRASS) g[y][x]=tFLOWER; });
  S(4,6,tSIGN);
  return {grid:g,W,H}; }

function initMaps(){ const town=buildTown();

(function(){ const pad=document.getElementById("dpad"); if(!pad)return;

    const move=e=>{ if(!active)return; const t=pt(e); steer(t.clientX,t.clientY); if(e.cancelable)e.preventDefault(); };
    const up=()=>{ active=false; release(); };

  rect(124,12,3,3,C.flowerY); rect(121,15,9,3,C.flowerY); rect(124,18,3,3,C.flowerY); rect(123,14,7,5,"#fff1a8");
  rect(0,96,SCRW,48,C.grass); rect(0,94,SCRW,2,C.grassD); rect(0,96,SCRW,1,C.grassL);
  for(let i=0;i<6;i++) drawTile(tTREE,i*30+2,78);
  /* logo plate */
  drawBox(14,12,132,42);
  drawCenterSh("POKEMON",18,C.roof,C.roofD,2); rect(26,40,108,1,C.navy);
  drawCenter("Mr Brewin's Class",44,C.navy,1);
  drawTeacher(34,112,"down",((tick>>4)&1)?1:0);
  drawDiary(37,119);
  if(DRAGO.length){ ctx.drawImage(DRAGO[(tick>>4)&1],84,56+((tick>>4)&1)); }
  /* floating hearts drifting up around the pair */
  for(let h=0;h<4;h++){ const hy=(106-((tick/3+h*36)%88))|0; const hx=(26+h*34+Math.sin(tick/18+h)*4)|0;
    if(hy>56) drawText("♥",hx,hy,(h&1)?C.flowerR:C.roofL,1); }
  if(((tick>>5)%2)===0) drawCenterSh("PRESS  START",131,C.white,C.navy,1); }
function drawIntro(){ clear(C.sky); rect(0,0,SCRW,40,C.skyD);
  drawCloud(((tick*0.16)%210)-36,12); drawCloud(((tick*0.10+150)%210)-36,40);
  rect(0,72,SCRW,72,C.grass); rect(0,70,SCRW,2,C.grassD); rect(0,72,SCRW,1,C.grassL);
  for(let i=0;i<3;i++) drawTile(tTREE,18+i*54,52);
  const ks=MAPS.town?MAPS.town.npcs:[]; for(let i=0;i<6&&i<ks.length;i++) drawKid(14+i*22,78,"down",((tick>>4)+i)&1,ks[i].look);
  if(dlg)drawDialogue(); }
function pokeballBig(x,y){ const r=(a,b,w,h,c)=>rect(x+a,y+b,w,h,c);
  r(4,0,14,2,C.black); r(2,2,18,3,C.flowerR); r(1,5,20,5,C.flowerR); r(3,3,6,1,C.roofL); r(0,10,22,2,C.black);
  r(1,12,20,5,C.white); r(2,17,18,3,C.white); r(4,20,14,2,C.black); r(7,8,8,6,C.black); r(9,10,4,2,C.white); }
function drawReceive(){ drawWorld(); ctx.fillStyle="rgba(20,20,28,0.55)"; ctx.fillRect(0,0,SCRW,SCRH-46);
  const cxp=SCRW/2;
  if(rec.step===0){ pokeballBig(cxp-11,52+((tick>>4)&1)); if(((tick>>4)%2)===0) drawCenter("Press A...",92,C.white,1); }
  else { const f=(tick>>3)&1, bob=Math.round(Math.sin(tick/9)*2); const gcy=48+bob;
    drawRays(cxp,gcy,tick/55);
    const gg=ctx.createRadialGradient(cxp,gcy,4,cxp,gcy,70);
    gg.addColorStop(0,"rgba(255,243,198,0.55)"); gg.addColorStop(1,"rgba(255,243,198,0)");
    ctx.fillStyle=gg; ctx.fillRect(0,0,SCRW,SCRH-46);
    if(DRAGO.length) ctx.drawImage(DRAGO[f],cxp-39,12+bob);
    for(const s of sparks) rect(s.x,s.y,2,2,s.a>0.5?C.white:C.flowerY); }
  if(rec.step>=2){ drawBox(3,SCRH-44,SCRW-6,42); drawCenter(CONFIG.teacherName+" received",SCRH-36,C.ink,1);
    drawCenter(CONFIG.starter+"!",SCRH-24,C.roof,1);
    if((tick>>4)&1){ rect(SCRW-14,SCRH-10,5,2,C.navy); rect(SCRW-13,SCRH-8,3,2,C.navy); rect(SCRW-12,SCRH-6,1,2,C.navy); } }
  if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+flash.toFixed(2)+")"; ctx.fillRect(0,0,SCRW,SCRH); } }
function drawFinale(){ clear(C.grass); rect(0,0,SCRW,8,C.grassD); rect(0,SCRH-46,SCRW,2,C.grassD);
  let i=0; for(const st of fin.list){ if(i>=32)break; const col=i%8,row=(i/8)|0;
    drawKid(6+col*19, 12+row*20, "down", ((tick>>4)+i)&1, st.look); i++; }
  drawTeacher(60,SCRH-60,"up",0); dragoMini(82,SCRH-60,(tick>>4)&1);
  for(let h=0;h<5;h++){ const hy=SCRH-58-((tick/2+h*22)%42); drawText("♥",22+h*26,hy,C.roof,1); }
  drawPetals();
  if(dlg)drawDialogue(); }
function drawTrainer(){ clear(C.navy);
  for(let i=0;i<SCRH;i+=4) rect(0,i,SCRW,1,"#23336b"); /* subtle scan stripes */
  drawBox(8,12,SCRW-16,SCRH-44);
  rect(12,16,SCRW-24,11,C.roof); rect(12,16,SCRW-24,1,C.roofL); drawTextSh("TRAINER CARD",16,18,C.white,C.roofD,1);
  drawBox(14,32,38,46); rect(16,34,34,42,C.sky); rect(16,34,34,1,"#bfe0ff"); drawTeacher(24,72,"down",0);
  drawText("NAME",58,34,C.navy,1); drawText(CONFIG.teacherName,58,44,C.ink,1);
  drawText("CLASS",58,58,C.navy,1); drawText(CONFIG.className,58,68,C.ink,1);
  drawText("GOODBYES "+studentsSpoken,14,84,C.ink,1);
  for(let i=0;i<8;i++){ const got=i<Math.min(8,Math.ceil(studentsSpoken/4)); drawText("♥",14+i*14,96,got?C.roof:"#c9c4b4",1); }
  drawBox(3,SCRH-30,SCRW-6,28); drawCenter("A champion teacher, through and through.",SCRH-24,C.ink,1);
  if((tick>>4)&1) drawCenter("Press A",SCRH-12,C.navy,1); }
function drawCredits(){ clear(C.navy);
  for(let i=0;i<SCRH;i+=4) rect(0,i,SCRW,1,"#23336b");
  if(creditsDone){ drawCenter("Thank you,",46,C.white,1); drawCenterSh(CONFIG.teacherName+"!",60,C.flowerY,C.roofD,2);
    drawText("♥",SCRW/2-3,86,C.roof,1); if((tick>>4)&1) drawCenter("Press A to play again",118,C.sky,1); return; }
  let y=creditsY|0; const big=new Set(["POKEMON",CONFIG.teacherName,CONFIG.starter]);
  for(const l of creditLines){ const sc=big.has(l)?2:1; const col=big.has(l)?C.flowerY:C.white;
    if(l&&y>-12&&y<SCRH){ if(sc===2) drawCenterSh(l,y,col,C.roofD,sc); else drawCenter(l,y,col,sc); } y+= l?(sc===2?20:11):7; }
  if(creditsY<60-creditsH) creditsDone=true; }

/* ---------------- LOOP ---------------- */
let last=performance.now();
function frame(t){ const dt=Math.min(0.05,(t-last)/1000); last=t; tick++;
  if(MAPS.town) MAPS.town.npcs.forEach(n=>{ n.step=(((tick>>5)+n.x)%9===0)?1:0; });
  if(state==="play"){ tryMove(dt); updateMove(dt); }
  if(state==="play"||state==="finale") updatePetals(dt);
  updateTrans(dt);
  if(dlg){ const tot=pageLen(); if(dlg.shown<tot){ dlg.shown+=dt*38; if(dlg.shown>=tot)dlg.shown=tot;
    else if((Math.floor(dlg.shown)&3)===0)sfx("text"); } }
  if(state==="receive"){ rec.t+=dt; if(rec.step===1&&rec.t>0.35){ rec.step=2; sfx("cry"); }
    if(rec.step>=1){ if(sparks.length<16&&Math.random()<.4) sparks.push({x:80+(Math.random()*40-20),y:40+Math.random()*40,vx:(Math.random()*2-1)*22,vy:(Math.random()*2-1)*22,a:1});
      for(const s of sparks){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.a-=dt*1.4; } for(let k=sparks.length-1;k>=0;k--) if(sparks[k].a<=0)sparks.splice(k,1); } }
  if(flash>0)flash=Math.max(0,flash-dt*2.2);
  if(state==="credits")creditsY-=dt*15;
  ctx.imageSmoothingEnabled=false;
  if(state==="title")drawTitle();
  else if(state==="intro")drawIntro();
  else if(state==="finale")drawFinale();
  else if(state==="trainer")drawTrainer();
  else if(state==="credits"){ if(!creditLines.length)buildCredits(); drawCredits(); }
  else { drawWorld(); if(state==="play")drawPetals(); drawHUD(); if(state==="play"&&!dlg)drawTracker();
    if(state==="receive")drawReceive(); if(dlg&&state!=="receive")drawDialogue(); }
  drawVignette(); drawTrans(); requestAnimationFrame(frame); }
/* boot */
buildVig(); initPetals();
DRAGO=[buildDragonite(0),buildDragonite(1)];
initMaps(); M=MAPS.town;
requestAnimationFrame(frame);
</script>
